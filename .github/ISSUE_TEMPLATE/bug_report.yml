name: Bug report
description: Something's broken or behaving unexpectedly.
title: "[Bug] "
labels: ["bug"]
assignees: ["Sojiroh"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out as much as you can; it makes a huge difference.

        If you're not sure whether it's a bug or expected behavior, prefer [Help & troubleshooting discussions](https://github.com/Sojiroh/FFXIV-FATEAutopilot/discussions/new?category=help-troubleshooting); triage is faster there.

        For security issues, please use [private vulnerability reporting](https://github.com/Sojiroh/FFXIV-FATEAutopilot/security/advisories/new) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see? What did you expect to see instead?
      placeholder: "It teleported to the zone and then stood still / it ignored a FATE / BossMod stopped attacking / the Collect hand-in stalled / auto-trade never reached the vendor..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug. If it's intermittent, say so.
      placeholder: |
        1. Open `/fta`
        2. Pick a goal and tick the zones on the Grind page
        3. Press Start
        4. ...
    validations:
      required: true

  - type: dropdown
    id: plugin-version
    attributes:
      label: Plugin version
      description: Shown in `/xlplugins` next to "FATE Autopilot".
      options:
        - 2.22.0.0
        - Older / not sure
    validations:
      required: true

  - type: dropdown
    id: goal
    attributes:
      label: Goal
      description: What the Grind page was set to.
      options:
        - Farm FATEs / Bicolor Gemstones
        - Shared FATE ranks
        - Relic / item goals
        - Yo-kai medals
        - Not sure
    validations:
      required: true

  - type: input
    id: companion-plugins
    attributes:
      label: vnavmesh, BossMod and TextAdvance versions
      description: Shown in `/xlplugins`. Mention BossMod Reborn if that is the one you run.
      placeholder: "vnavmesh 0.0.0.0, BossMod Reborn 0.0.0.0, TextAdvance 0.0.0.0"

  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail?
      description: Each cycle the plugin picks a zone, teleports in, finds an active FATE, flies or walks to it, fights it with BossMod and starts over; between FATEs it can trade gemstones, repair and take breaks.
      options:
        - Travel (teleport, flying, aethernet, stuck or lost on the way)
        - Picking a FATE (wrong FATE, skipped FATE, filters, blacklist)
        - Fighting (BossMod rotation, positioning, pulling, dying)
        - Collect FATEs (item pickup, hand-in)
        - Auto-trade (gemstones, shopping list, vendor)
        - Repair, consumables, humanizer breaks or after-run actions
        - Goals (Shared FATE ranks, relics, Yo-kai, class queue)
        - Selection / UI (window, settings, themes, languages)
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: |
        **If you can provide any of these, it turns guesswork into a fix.**

        - **Plugin console**: open `/fta log`, press *Copy log* and paste the result into the console field below. It already includes the plugin version, Dalamud version and zone.
        - **Dalamud log**: open `/xllog`, click the *Open log folder* button at the bottom-right, attach `dalamud.log`. Filter by `[FTA]` if you want to trim it down.
        - **Screenshots / short clip** if the issue is visual.
        - **Other plugins active** that touch movement, targeting, combat rotation, chat commands or teleporting — helps rule out conflicts.

  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: |
        Paste what *Copy log* on the plugin's Console page (`/fta log`) put on your clipboard. Short snippets (chat-log tail, Dalamud error text) also belong here; attach full `dalamud.log` files under **Attachments** above.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: The zones ticked, the filters, humanizer and travel settings, anything that helps the bug land.
